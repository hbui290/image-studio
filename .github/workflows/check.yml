name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.12', '3.14']
        deps: ['pillow jsonschema']
        include:
          - python: '3.12'
            deps: 'pillow'
          - python: '3.12'
            deps: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - if: matrix.deps != ''
        run: python -m pip install ${{ matrix.deps }}
      - run: python -m unittest discover -s tests -v
      - if: matrix.deps == 'pillow jsonschema'
        run: |
          python plugins/image-studio/skills/image-edit-map/scripts/validate_spec.py plugins/image-studio/skills/image-edit-map/examples/image-spec.example.json
          python plugins/image-studio/skills/image-edit-map/scripts/validate_spec.py examples/image-reverse-engineer/image-spec.json --image examples/product/source.png
          python plugins/image-studio/skills/image-reconstruction/scripts/reconstruct.py self-check
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: npm install -g @anthropic-ai/claude-code@2.1.220
      - run: claude plugin validate --strict . && claude plugin validate --strict plugins/image-studio
